# Practical tmux config for daily terminal work.

##### General
set -g default-terminal "tmux-256color"
# Use the login shell configured on each machine.
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

##### Prefix
# Keep the default Ctrl-b prefix, but make pressing prefix twice send Ctrl-b.
unbind C-b
set -g prefix C-b
bind C-b send-prefix

##### Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### Splits and panes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind m resize-pane -Z ; display-message "pane focus toggled"
bind f resize-pane -Z ; display-message "pane focus toggled"
bind x kill-pane

##### Windows
bind n next-window
bind p previous-window
bind w choose-window
bind , command-prompt -I "#W" "rename-window '%%'"

##### Sessions
bind s choose-tree -s
bind S command-prompt -p "New session name:" "new-session -d -s '%%' \; switch-client -t '%%'"

##### Copy mode
setw -g mode-keys vi
bind [ copy-mode
bind ] paste-buffer

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send -X rectangle-toggle

##### Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "
setw -g window-status-current-style "bg=#89b4fa,fg=#11111b,bold"

set -g status-left-length 40
set -g status-left " #S "
set -g status-right-length 80
set -g status-right " %Y-%m-%d %H:%M "


### restore
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
