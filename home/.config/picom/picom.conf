backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.24;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'"
];

corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;
detect-rounded-corners = true;
detect-client-leader = true;
use-damage = true;

opacity-rule = [
  "94:class_g = 'Alacritty'",
  "99:class_g = 'Code'",
  "99:class_g = 'code'",
  "99:class_g = 'VSCodium'",
  "100:class_g = 'Google-chrome'",
  "100:class_g = 'google-chrome'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; };
  dropdown_menu = { opacity = 0.98; };
};
