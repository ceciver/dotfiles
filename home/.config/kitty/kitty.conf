font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font auto
font_size 12.0

background_opacity 0.94
window_padding_width 10
adjust_line_height 2
adjust_column_width 0
confirm_os_window_close 0
enable_audio_bell no
kitty_mod super

# Clipboard stays on Ctrl-Shift for terminal text workflows.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Super/window-key is reserved for Kitty-only actions.
map super+enter new_window
map super+v launch --location=vsplit
map super+s launch --location=hsplit
map super+h neighboring_window left
map super+j neighboring_window down
map super+k neighboring_window up
map super+l neighboring_window right
map super+left neighboring_window left
map super+down neighboring_window down
map super+up neighboring_window up
map super+right neighboring_window right
map super+w close_window
map super+r start_resizing_window

foreground #abb2bf
background #23272e
selection_foreground #23272e
selection_background #abb2bf
cursor #528bff
cursor_text_color #ffffff

color0 #3f4451
color1 #e05561
color2 #8cc265
color3 #d18f52
color4 #4aa5f0
color5 #c162de
color6 #42b3c2
color7 #d7dae0

color8 #4f5666
color9 #ff616e
color10 #a5e075
color11 #f0a45d
color12 #4dc4ff
color13 #de73ff
color14 #4cd1e0
color15 #e6e6e6
