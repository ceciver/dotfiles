[colors]
bg = #1e1e2e
bg-alt = #313244
fg = #cdd6f4
muted = #6c7086
accent = #89b4fa
red = #f38ba8
green = #a6e3a1
yellow = #f9e2af

[bar/main]
width = 100%
height = 26
radius = 0
fixed-center = true
bottom = false

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 2

font-0 = JetBrains Mono:size=10;2

modules-left = i3
modules-center = date
modules-right = pulseaudio memory cpu battery

override-redirect = false
enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false

label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.bg}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.fg}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.fg}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = MUTED
label-muted-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
label-charging = CHG %percentage%%
label-discharging = BAT %percentage%%
label-full = FULL

[module/tray]
type = internal/tray
tray-spacing = 8
tray-size = 60%
